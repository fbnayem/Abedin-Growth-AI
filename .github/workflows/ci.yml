name: CI

# P2 — The gate. Until this existed there was no automated check of any kind: no test runner,
# no type-check on push, no dependency audit. A green build meant nothing had been run.
#
# Every job here fails the workflow on a non-zero exit. Do not add `|| true`, `continue-on-error`
# or `|| echo "Ignoring..."` to any step — a gate that cannot fail is not a gate, and this
# repository has already shipped one of those (see server/tests/adversarial.test.ts before P2,
# which reported "4/4 passed" unconditionally).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` rather than `npm install`: it fails if package-lock.json and package.json
      # disagree, which is a supply-chain check in itself (addendum §T).
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      # S49 — the build carries its identity or it does not have one.
      #
      # `/api/health` reports `source: INJECTED` only when BUILD_SHA is set here. Without it the
      # server falls back to reading `.git`, which it labels GIT_WORKING_TREE and does NOT
      # present as identifying a released artifact — a working tree can be dirty, so the SHA
      # names a commit that is not necessarily what is running. An operator reaching for the
      # kill switch has to be able to say which build is live and what to roll back to; the
      # service name, which is what this endpoint used to return, is the same string in every
      # build that has ever run.
      - name: Build
        run: npm run build
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_VERSION: ${{ github.ref_name }}
          BUILD_TIME: ${{ github.event.repository.updated_at }}

      # A build whose identity is unreadable is not a releasable artifact. Asserted rather than
      # assumed, because the injection is three lines of YAML away from silently not happening
      # and nothing else would notice.
      - name: The built artifact must know which commit it is
        run: node scripts/check-build-provenance.mjs
        env:
          BUILD_SHA: ${{ github.sha }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # S49 — two steps, because "high and above" alone is a gate that has never had anything
      # to hold. There are no high or critical advisories, so it passes for a reason unrelated
      # to anything the repository does; the note that used to sit here called it "advisory for
      # now", which read as if the step were doing less than it does rather than more.
      - name: npm audit (high and above must be zero)
        run: npm audit --audit-level=high

      # The moderate count may FALL and may not RISE. Thirteen remain, all reached through three
      # roots, and each has a reason it is still here rather than an intention to look later:
      #
      #   qs         express 4 -> body-parser -> qs. In the production request path. npm reports
      #              a fix as available and `npm audit fix` does not move it: 6.15.3 is the
      #              newest express@4 permits, so the real fix is express 5, which is a
      #              framework upgrade and not a dependency bump.
      #   esbuild    a DEV-SERVER request vulnerability, reached through drizzle-kit. Not in any
      #              deployed path — the production build is a bundle, not a dev server. The
      #              offered fix downgrades drizzle-kit to 0.18.1, a major step backwards that
      #              would take the migration tooling with it.
      #   uuid       v3/v5/v6 buffer bounds, reached through firebase-admin. The application
      #              uses v4 from its own direct dependency. The offered fix downgrades
      #              firebase-admin by seven majors.
      #
      # A ratchet rather than a threshold, so a NEW moderate advisory fails the build while the
      # three above do not silently license a fourth. Lower the number when one is resolved; if
      # this step fails because the count dropped, that is the ratchet working.
      - name: npm audit (moderate count must not rise)
        run: node scripts/check-dependency-advisories.mjs

  guardrails:
    name: Safety guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # P0.1 — The browser must never regain the ability to send mail directly. The source can
      # look clean while the built artifact is not, which is exactly how the second gmail.send
      # grant in src/lib/firebase.ts survived the first fix. Assert on the artifact.
      - name: Build client
        run: npm run build

      - name: Client bundle must not contain send-capable Gmail scopes
        run: |
          if grep -rl "auth/gmail.send" dist/assets/ 2>/dev/null; then
            echo "::error::gmail.send scope found in the client bundle. Sending must go through the server ActionGateway (P0.1)."
            exit 1
          fi
          if grep -rl "messages/send" dist/assets/ 2>/dev/null; then
            echo "::error::A Gmail send endpoint is reachable from the client bundle (P0.1)."
            exit 1
          fi
          echo "OK: no client-side send capability."

      # P0.8 — A provider id must come from a provider. Catch a reintroduced local mint.
      - name: No fabricated provider ids in source
        run: |
          if grep -rnE "'(sim|mock)_' \+ Date\.now\(\)" server/ server.ts --include="*.ts" | grep -v "^\s*//" | grep -v "P0\.8"; then
            echo "::error::Locally-minted provider id found. A message cannot become SENT without a real provider result (addendum §3)."
            exit 1
          fi
          echo "OK: no fabricated provider ids."

      # P1.1 — Tenancy. Two properties, both greppable, both regressions this repository has
      # actually had:
      #   1. No hardcoded organisation id. There were 42 of them across seven files, and every
      #      one made the system single-tenant while looking multi-tenant.
      #   2. No hand-built tenant path. orgPath() is where the org id is validated before it
      #      becomes a Firestore path segment; a path assembled inline skips that check, and an
      #      org id now arrives from a token rather than a literal.
      - name: No hardcoded organisation id
        run: |
          if grep -rn "org_1" --include="*.ts" --include="*.tsx" server/ server.ts src/ shared/ scripts/ 2>/dev/null; then
            echo "::error::Hardcoded organisation id found. Resolve the tenant with orgScope(req) (addendum §4 / P1.1)."
            exit 1
          fi
          echo "OK: no hardcoded organisation id."

      - name: Tenant paths must be built with orgPath()
        run: |
          if grep -rnE "['\"\`]organizations/" --include="*.ts" server/ server.ts 2>/dev/null \
             | grep -v "^server/tenancy/orgScope.ts:" \
             | grep -v "^server/tests/"; then
            echo "::error::A tenant path was built by hand. Use orgPath(orgId, ...) so the org id is validated before it becomes a path segment (P1.1)."
            exit 1
          fi
          echo "OK: all tenant paths go through orgPath()."

      # Three times now a raw NUL byte has been written into a source file: a digest
      # delimiter, a path-injection fixture, and a null-byte sanitiser fixture. All three
      # compiled and ran correctly, so nothing downstream complained -- but git renders such a
      # file as "Binary files differ" (no reviewable diff), grep skips it, and every
      # grep-based guardrail above therefore excludes it silently.
      #
      # This runs a script rather than a grep on purpose. The obvious check,
      # a grep for a NUL pattern over server/, returns "no matches" against a file that definitely
      # contains one, because grep treats it as binary and skips it. That was measured, not
      # assumed. A guardrail that cannot fail is worse than none.
      - name: No NUL bytes in source files
        run: node scripts/check-no-nul-bytes.mjs

      # P1.10 (§18) — Externally retrieved material must never gain system authority. A model
      # call built as one string gives the customer's email the same authority as the
      # instructions around it. This is a RATCHET rather than a ban: the count of legacy
      # single-string call sites may fall and may not rise, so the migration is monotonic
      # without blocking on doing all of them at once.
      - name: Prompt authority separation (ratchet)
        run: node scripts/check-prompt-authority.mjs

      # P1.12 (§12) — One error envelope. A hand-built { error: ... } body looks identical to
      # the real one and is not: it has no requestId, because only sendError knows about it,
      # and it may echo an internal message the envelope would have kept in the log. That drift
      # happened once already, WHILE removing it, and was caught by comparing actual HTTP
      # responses rather than by reading the code.
      - name: All errors go through the one envelope
        run: node scripts/check-error-envelope.mjs
